<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06111f">
  <link rel="stylesheet" href="/styles.css">
  <title>Günlük Futbol Analiz + Value</title>
</head>

<body>
  <header class="header">
    <div>
      <h1>Günlük Futbol Analiz + Value</h1>
      <p>Gerçek veri • Model olasılığı • Value</p>
    </div>

    <button id="refreshBtn" class="refresh">↻</button>
  </header>

  <main>
    <section class="controls">
      <input id="dateInput" type="date">
      <span id="status">Veri yükleniyor...</span>
    </section>

    <nav id="leagueFilters" class="league-filters"></nav>

    <section>
      <h2>En Yüksek EV İlk 10</h2>
      <div id="topEv" class="cards"></div>
    </section>

    <section>
      <h2>Günün En Güvenilir Oyunları</h2>
      <div id="trusted" class="cards"></div>
    </section>

    <section>
      <h2>Günün Lig Maçları</h2>
      <div id="matches" class="cards"></div>
    </section>
  </main>

  <footer>
    Gerçek oran yoksa EV gösterilmez. Olasılıklar tahmindir; garanti değildir.
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
